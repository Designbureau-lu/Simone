<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konschtpräis 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="conversationBar" class="conversation-bar">
    <output class="conversation-bar-text" data-conversation-text aria-live="polite" aria-label="Konschtpräis 2026">
        <span class="conversation-title-line" data-conversation-title-line aria-hidden="true">Konschtpräis 2026</span>
    </output>
    <button type="button" class="conversation-menu-trigger" data-conversation-menu-trigger aria-expanded="false" aria-controls="conversationProjectList" aria-label="Open project list">☰</button>
    <nav id="conversationProjectList" class="conversation-project-list" aria-label="Projects" hidden>
        <ul data-conversation-projects></ul>
    </nav>
</header>

<aside id="semanticNavigation" hidden aria-label="Temporary semantic navigation">
    <select data-project-select disabled aria-label="Choose project">
        <option value="">Choose project…</option>
    </select>
    <output data-project-label>Project — / —</output>
    <button type="button" data-project-previous disabled>PREVIOUS</button>
    <button type="button" data-project-next disabled>NEXT</button>
</aside>

<input hidden type="file" id="fileInput" accept="image/*" multiple>

<aside id="debugPanel" class="debug-panel" aria-label="Development controls" hidden>
    <button type="button" class="debug-panel-close" data-debug-close aria-label="Close development controls">×</button>

    <div class="controls" aria-label="Periodic surface controls">
        <div class="debug-control">
            <label for="minimumVisibleFactorInput">Minimum Visible Factor</label>
            <div class="debug-control-inputs">
                <input type="range" id="minimumVisibleFactorInput" min="0" max="100" value="20" step="1">
                <input type="number" id="minimumVisibleFactorNumber" min="0" max="100" value="20" step="1" aria-label="Minimum Visible Factor value">
                <span>%</span>
            </div>
        </div>

        <div class="debug-control">
            <label for="maximumVisibleFactorInput">Maximum Visible Factor</label>
            <div class="debug-control-inputs">
                <input type="range" id="maximumVisibleFactorInput" min="0" max="100" value="100" step="1">
                <input type="number" id="maximumVisibleFactorNumber" min="0" max="100" value="100" step="1" aria-label="Maximum Visible Factor value">
                <span>%</span>
            </div>
        </div>

        <div class="debug-control">
            <label for="resetCurtainStateInput">Reset Curtain State</label>
            <div class="debug-control-inputs">
                <input type="range" id="resetCurtainStateInput" min="0" max="100" value="37.5" step="0.1">
                <input type="number" id="resetCurtainStateNumber" min="20" max="100" value="50" step="1" aria-label="Reset Curtain State value">
                <span>%</span>
            </div>
        </div>

        <div class="debug-control">
            <label for="carrierDistanceInput">Carrier Distance</label>
            <div class="debug-control-inputs">
                <input type="range" id="carrierDistanceInput" min="20" max="300" value="120" step="1">
                <input type="number" id="carrierDistanceNumber" min="20" max="300" value="120" step="1" aria-label="Carrier distance value">
                <span>mm</span>
            </div>
        </div>

        <div class="debug-control">
            <label for="modelTransitionInput">Model Transition</label>
            <div class="debug-control-inputs">
                <input type="range" id="modelTransitionInput" min="0" max="100" value="50" step="1">
                <input type="number" id="modelTransitionNumber" min="0" max="100" value="50" step="1" aria-label="Model transition value">
                <span>%</span>
            </div>
        </div>
    </div>

    <div class="developer-viewport-control">
        <label for="viewportPositionInput">Viewport Position</label>
        <input type="range" id="viewportPositionInput" min="0" max="100" value="0" step="0.1">
        <output id="viewportPositionValue" for="viewportPositionInput">0% · X 0 projected px</output>
    </div>

    <section id="performanceOverview" class="performance-overview" aria-label="Performance information">
        <div class="performance-overview-header">
            <span>Performance</span>
        </div>
        <div data-performance-body>
            <pre data-performance-output>PERFORMANCE
Load artwork to begin measuring.</pre>
            <button type="button" data-reset-worst>Reset Worst</button>
        </div>
    </section>
</aside>
<button id="debugReopen" type="button" class="debug-reopen" data-debug-reopen aria-label="Open development controls">Dev</button>

<div class="container">
    <div id="curtainPresentation" class="curtain-presentation">
        <canvas id="canvas"></canvas>
    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
